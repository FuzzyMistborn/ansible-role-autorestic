---
- name: Get status of restic_install_path
  ansible.builtin.stat:
    path: "{{ autorestic_restic_install_path }}"
  register: autorestic_restic_stat

- name: Set restic installed
  ansible.builtin.set_fact:
    autorestic_restic_is_installed: "{{ autorestic_restic_stat.stat.exists }}"

- name: Get restic version
  ansible.builtin.shell: "{{ autorestic_restic_stat.stat.path }} version | grep -oP 'restic\\ \\K[0-9]*\\.[0-9]*\\.[0-9]*'"
  register: autorestic_restic_installed_version_registered
  changed_when: false
  check_mode: false
  when: autorestic_restic_is_installed == True

- name: Get latest GH restic version
  ansible.builtin.uri:
    url: https://api.github.com/repos/restic/restic/releases/latest
    url_username: "{{ github_api_user | default(omit) }}"
    url_password: "{{ github_api_pass | default(omit) }}"
    return_content: true
    force_basic_auth: "{{ github_api_auth | default(omit) }}"
  register: autorestic_restic_release_registered
  check_mode: false
  when: autorestic_restic_download_latest_ver == True

- name: Set restic version (latest)
  ansible.builtin.set_fact:
    autorestic_restic_ver: "{{ autorestic_restic_release_registered.json.tag_name | regex_replace('v') }}"
  when: autorestic_restic_download_latest_ver == True

- name: Set restic version (pinned)
  ansible.builtin.set_fact:
    autorestic_restic_ver: "{{ autorestic_restic_pinned_ver }}"
  when: autorestic_restic_download_latest_ver == False

- name: Install restic
  when: autorestic_restic_is_installed == False or ( autorestic_restic_is_installed == True and autorestic_restic_download_latest_ver == True and autorestic_restic_installed_version_registered.stdout !=
    autorestic_restic_ver ) or ( autorestic_restic_is_installed == True and autorestic_restic_download_latest_ver == False and autorestic_restic_installed_version_registered.stdout != autorestic_restic_pinned_ver )
  block:
    - name: Ensure restic_download_directory does not exist
      ansible.builtin.file:
        path: "{{ autorestic_restic_download_directory }}"
        state: absent

    - name: Create restic_download_directory
      ansible.builtin.file:
        path: "{{ autorestic_restic_download_directory }}"
        state: directory
        mode: "0755"

    - name: Download restic
      ansible.builtin.get_url:
        url: "{{ autorestic_restic_gh_url }}/v{{ autorestic_restic_ver }}/restic_{{ autorestic_restic_ver }}_{{ autorestic_restic_distro }}.bz2"
        dest: "{{ autorestic_restic_download_directory }}"
        force: true
        owner: root
        group: root
        mode: +x

    - name: Ensure bzip2 is installed
      ansible.builtin.package:
        name: bzip2
        state: present

    - name: Set restic filename
      ansible.builtin.set_fact:
        autorestic_restic_file_name: "restic_{{ autorestic_restic_ver }}_{{ autorestic_restic_distro }}.bz2"

    - name: Unzip restic release
      ansible.builtin.shell: "cd {{ autorestic_restic_download_directory }} && bzip2 -d {{ autorestic_restic_file_name }} && mv {{ autorestic_restic_file_name | regex_replace('.bz2') }} {{ autorestic_restic_install_path
        }}"

    - name: Fedora - SELinux Fix
      ansible.builtin.command: restorecon -Rv /usr/local/bin
      become: true
      when: ansible_facts.distribution == 'Fedora'
